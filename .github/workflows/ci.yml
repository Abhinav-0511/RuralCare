name: CI

on:
  push:
  pull_request:

jobs:
  node:
    name: Node (shared, server, client)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      # Server tests start TimescaleDB + Mosquitto with Testcontainers; on CI a missing Docker is a failure.
      - run: npm test
        env:
          REQUIRE_DOCKER_TESTS: '1'

  python:
    name: Python (ai-service)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ai-service/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      # Enables tests/test_training.py (retrain + compare with the committed fixtures). Kaggle serves
      # this public dataset without credentials; if it is unreachable those tests are skipped.
      - name: Fetch dataset (optional)
        run: python -m training.fetch_dataset
        continue-on-error: true
      - run: python -m training.check_dataset || echo "dataset not available, training tests will be skipped"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  edge:
    name: Python (edge simulator)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: edge
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: edge/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: for d in infra server ai-service client edge; do cp $d/.env.example $d/.env; done
      - run: docker compose -f infra/docker-compose.yml build

  e2e:
    name: E2E (Playwright, full Docker stack)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: for d in infra server ai-service client edge; do cp $d/.env.example $d/.env; done
      # The seed (server container, user `node`) writes MQTT credentials into this bind mount,
      # which the runner's checkout user owns.
      - run: chmod 0777 infra/mosquitto/generated
      - run: docker compose -f infra/docker-compose.yml up -d --build --wait
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e -w @ruralcare/client
      - name: Stack logs
        if: failure()
        run: docker compose -f infra/docker-compose.yml logs --no-color --tail=200
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            client/playwright-report/
            client/test-results/
          retention-days: 7
