# Mosquitto 2.x: authenticated, deny-by-default.
# Accounts and ACL live in generated/ (written by `npm run devices:provision -w @ruralcare/server`;
# entrypoint.sh always (re)creates the server account from MQTT_SERVER_USERNAME/PASSWORD).
#   - server: may READ ruralcare/vitals/# (and $SYS for the health check), never publish
#   - each device: may only WRITE ruralcare/vitals/<its patientId>/<its deviceId>

persistence true
persistence_location /mosquitto/data/
log_dest stdout

allow_anonymous false
password_file /mosquitto/config/generated/passwd
acl_file /mosquitto/config/generated/acl

listener 1883

# WebSockets (debugging tools); same accounts and ACL.
listener 9001
protocol websockets
