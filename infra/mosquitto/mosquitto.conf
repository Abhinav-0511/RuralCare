# Mosquitto 2.x — development config
# NOTE: anonymous access is for local development only.
# Phase 4 switches to a password_file (and TLS for any non-local deployment).

persistence true
persistence_location /mosquitto/data/
log_dest stdout

# Plain MQTT (devices, server subscriber)
listener 1883
allow_anonymous true

# WebSockets (optional browser clients / debugging)
listener 9001
protocol websockets
