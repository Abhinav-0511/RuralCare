server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # The service worker and manifest must never be cached by the browser HTTP cache,
    # otherwise PWA updates won't roll out
    location = /sw.js              { add_header Cache-Control "no-cache"; }
    location = /manifest.webmanifest { add_header Cache-Control "no-cache"; }

    # Hashed build assets and model files can be cached long-term
    location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    types { application/wasm wasm; }
    gzip on;
    gzip_types text/css application/javascript application/json application/wasm image/svg+xml;
}
